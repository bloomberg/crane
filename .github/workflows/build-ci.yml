name: Build CI

on:
  - pull_request
  - push

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        coq_version:
          - "9.0"
        ocaml_version:
          - "4.14-flambda"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize Workspace Permissions
        run: |
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Build and Extract
        uses: coq-community/docker-coq-action@v1
        with:
          opam_file: 'rocq-crane.opam'
          coq_version: ${{ matrix.coq_version }}
          ocaml_version: ${{ matrix.ocaml_version }}
          before_install: |
            startGroup "Print opam config"
              opam config list; opam repo list; opam list
            endGroup
          # A custom script replaces the action's default one, so it has to
          # ask for the dependency installation itself.  One command per
          # line: the script runs under `set -e`, which ignores a failure on
          # the left of `&&` -- a build that never found coqc used to pass.
          custom_script: |
            {{before_install}}
            {{install}}
            {{after_install}}
            startGroup "Build project"
              opam exec -- dune build -p rocq-crane
              opam exec -- dune install
            endGroup
            startGroup "OCaml unit tests"
              opam exec -- dune build @unit_tests/runtest
            endGroup
            startGroup "Module dependency direction"
              opam exec -- scripts/check-module-deps.sh
            endGroup

      - name: Install clang and GMP
        run: |
          # clang-19 doesn't parse structured-binding packs (theories/cpp/shared_variant.h);
          # pull a newer clang from LLVM's apt repo instead of Ubuntu noble's default.
          # Point CXX at it directly for later steps rather than relying on
          # update-alternatives, which left clang++ resolving to an older clang.
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y libc++-22-dev libc++abi-22-dev libgmp-dev
          echo "CXX=clang++-22" >> "$GITHUB_ENV"
          clang++-22 --version

      - name: Generated headers compile standalone
        run: scripts/check-headers-standalone.sh

      - name: Run C++ tests
        run: |
          # Find and run all test executables except those in wip or requiring BDE
          failed=0
          passed=0
          skipped=0

          for dir in tests/*/; do
            dirname=$(basename "$dir")
            # Skip wip directory
            if [ "$dirname" = "wip" ]; then
              echo "Skipping tests/wip/ (work in progress)"
              continue
            fi

            # Find all .t.cpp files in this directory tree
            for test_src in $(find "$dir" -name "*.t.cpp" 2>/dev/null); do
              test_dir=$(dirname "$test_src")
              test_name=$(basename "$test_src" .t.cpp)

              # Skip BDE tests (they end with _bde)
              if [[ "$test_name" == *_bde ]]; then
                echo "⊘ SKIPPED: $test_name (requires BDE)"
                skipped=$((skipped + 1))
                continue
              fi

              echo "=== Building and running: $test_dir/$test_name ==="

              compile_script="scripts/compile-std.sh"
              if [[ "$test_name" == *_gmp ]]; then
                compile_script="scripts/compile-gmp.sh"
              fi

              # Read the .cpp sources to link with the driver from this test's
              # own dune rule, rather than globbing the directory: a test
              # directory can hold other extraction targets' standalone
              # outputs that are not part of this test's link (e.g.
              # dependent_extraction_targets/*_a.cpp, present only for
              # check-headers-standalone.sh), and some tests need
              # $test_name.cpp plus named extras (e.g.
              # erased_nested_type_args needs instance_in_record_literal.cpp
              # too). A separate-extraction test with one .cpp per Rocq
              # module (e.g. Datatypes.cpp, List.cpp) lists all of them in
              # its rule the same way. A directory dune has no rule for (e.g.
              # a template harness) falls back to collecting every .cpp, as
              # before.
              suite_dune="$(dirname "$test_dir")/dune"
              if grep -q "(subdir $test_name\$" "$suite_dune" 2>/dev/null; then
                cpp_sources=()
                while IFS= read -r fname; do
                  cpp_sources+=("$fname")
                done < <(
                  awk -v name="$test_name" '
                    $0 ~ "\\(subdir " name "$" { found=1 }
                    found && /\(subdir / && $0 !~ "\\(subdir " name "$" { exit }
                    found && (/compile-std\.sh/ || /compile-gmp\.sh/ || /compile-bde\.sh/) { print; exit }
                  ' "$suite_dune" | grep -oE '[A-Za-z0-9_./]+\.cpp' | grep -v '\.t\.cpp$'
                )
              else
                cpp_sources=()
                for f in "$test_dir"/*.cpp; do
                  [ -f "$f" ] || continue
                  fname=$(basename "$f")
                  if [[ "$fname" == *.t.cpp ]]; then continue; fi
                  cpp_sources+=("$fname")
                done
              fi

              # Compile the test
              if (
                cd "$test_dir"
                "$GITHUB_WORKSPACE/$compile_script" "$GITHUB_WORKSPACE" "$test_name.t.exe" \
                  "${cpp_sources[@]}" "$test_name.t.cpp"
              ) 2>&1; then
                # Run the test from its directory (tests may read files by relative path)
                if (cd "$test_dir" && "./$test_name.t.exe"); then
                  echo "✓ PASSED: $test_name"
                  passed=$((passed + 1))
                else
                  echo "✗ FAILED: $test_name (runtime error)"
                  failed=$((failed + 1))
                fi
              else
                echo "✗ FAILED: $test_name (compilation error)"
                failed=$((failed + 1))
              fi
              echo ""
            done
          done

          echo "================================"
          echo "Results: $passed passed, $failed failed, $skipped skipped"
          echo "================================"

          if [ $failed -gt 0 ]; then
            echo "Some tests failed!"
            exit 1
          fi
          echo "All tests passed!"
